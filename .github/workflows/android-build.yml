
name: STEM AI Studio APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'STEM_AI_Studio_Phase1.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          unzip -q STEM_AI_Studio_Phase1.zip -d .
          ls -la STEM_AI_Studio

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p STEM_AI_Studio \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STEM-AI-Studio-APK
          path: STEM_AI_Studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
