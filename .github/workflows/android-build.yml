name: STEM AI Studio APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'STEM_AI_Studio_Phase2.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Extract project
      - name: Extract Phase 2 Project
        shell: bash
        run: |
          set -e

          ZIP="STEM_AI_Studio_Phase2.zip"

          test -f "$ZIP"
          unzip -t "$ZIP"
          unzip -o "$ZIP" -d .

          echo "=== EXTRACTED FILES ==="
          find . -maxdepth 4 -type f | head -100

      # 2. Detect actual Android project
      - name: Detect Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do
            CANDIDATE="${SETTINGS%/*}"

            if [[ -f "$CANDIDATE/app/build.gradle" ]] || \
               [[ -f "$CANDIDATE/app/build.gradle.kts" ]]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find . -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Detected project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # 3. Download model directly into real project
      - name: Download HT-Demucs 6S Model
        shell: bash
        run: |
          set -e

          MODEL_NAME="htdemucs_6s_fp16weights.onnx"
          MODEL_URL="https://huggingface.co/StemSplitio/htdemucs-6s-onnx/resolve/main/htdemucs_6s_fp16weights.onnx"

          TARGET="$PROJECT_DIR/app/src/main/assets"

          mkdir -p "$TARGET"

          curl --fail --location \
            --retry 3 \
            --retry-all-errors \
            "$MODEL_URL" \
            -o "/tmp/$MODEL_NAME"

          SIZE=$(stat -c%s "/tmp/$MODEL_NAME")

          echo "Model size: $SIZE bytes"

          if [ "$SIZE" -lt 100000000 ]; then
            echo "ERROR: Model file too small"
            exit 1
          fi

          cp "/tmp/$MODEL_NAME" "$TARGET/$MODEL_NAME"

          echo "=== MODEL VERIFIED ==="
          ls -lh "$TARGET/$MODEL_NAME"

      # 4. Verify model before build
      - name: Verify Model Before Build
        shell: bash
        run: |
          set -e

          MODEL="$PROJECT_DIR/app/src/main/assets/htdemucs_6s_fp16weights.onnx"

          test -s "$MODEL"

          echo "ONNX model exists"
          sha256sum "$MODEL"

      # 5. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' \
            'build-tools;35.0.0'

      # 8. Build APK
      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "Building project: $PROJECT_DIR"

          gradle \
            --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      # 9. Verify ONNX inside APK
      - name: Verify ONNX Model Inside APK
        shell: bash
        run: |
          set -e

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          APK=$(find "$APK_DIR" -type f \
            -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK: $APK"

          echo "=== CHECKING MODEL INSIDE APK ==="

          if unzip -Z1 "$APK" | grep -Fx \
            "assets/htdemucs_6s_fp16weights.onnx"; then

            echo "SUCCESS: ONNX model embedded in APK"

          else
            echo "ERROR: ONNX model missing from APK"

            echo "=== AVAILABLE ASSETS ==="
            unzip -Z1 "$APK" | grep 'assets/' | head -100 || true

            exit 1
          fi

          echo "=== APK SIZE ==="
          ls -lh "$APK"

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STEM-AI-Studio-Phase2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
