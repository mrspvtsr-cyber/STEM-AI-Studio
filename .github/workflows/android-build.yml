
name: STEM AI Studio APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'STEM_AI_Studio_Phase2.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      
      - name: Extract Phase 2 Project
        run: |
          set -e

          ZIP="STEM_AI_Studio_Phase2.zip"

          echo "=== CHECK ZIP FILE ==="
          ls -lh "$ZIP"
          file "$ZIP" || true

          echo "=== VALIDATE ZIP ==="
          unzip -t "$ZIP"

          echo "=== EXTRACT PROJECT ==="
          unzip -o "$ZIP" -d .

          echo "=== PROJECT FILES ==="
          find . -maxdepth 3 -type f | head -80


      - name: Download HT-Demucs 6S Model
        run: |
          mkdir -p STEM_AI_Studio/app/src/main/assets
          curl --fail --location --retry 3 \
            'https://huggingface.co/StemSplitio/htdemucs-6s-onnx/resolve/main/htdemucs_6s_fp16weights.onnx' \
            -o STEM_AI_Studio/app/src/main/assets/htdemucs_6s_fp16weights.onnx
          test "$(stat -c%s STEM_AI_Studio/app/src/main/assets/htdemucs_6s_fp16weights.onnx)" -gt 100000000

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' \
            'build-tools;35.0.0'

      
      - name: Build APK
        run: |
          echo "Searching Android Gradle project..."

          PROJECT_FILE=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found!"
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Project root: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug
          

      
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STEM-AI-Studio-Phase2-APK
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 7
          

